<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        :root {
    /* =========================
       MATHEMATICS — GREEN THEME
    ========================= */

    --primary-dark: #073827;
    --primary-forest: #16623d;
    --primary-accent: #339763;

    --tint-light: #e7f7ee;
    --card-bg: #f7faf8;

    --white: #ffffff;

    --text-main: #073827;
    --text-body: #2d473b;
    --text-muted: #567e6c;

    --border-color: #d8eade;

    --success: #2e7d32;
    --danger: #c62828;

    --font-brand: 'Montserrat', sans-serif;
    --font-body: 'Inter', system-ui, -apple-system, sans-serif;
}


/* =========================
   RESET
========================= */

*,
*::before,
*::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}


html,
body {
    width: 100%;
    min-height: 100vh;

    background-color: var(--white);
    color: var(--text-body);

    font-family: var(--font-body);

    overflow-x: hidden;
    scroll-behavior: smooth;
}


/* =========================
   SECTION
========================= */

.section {
    width: 100%;
    min-height: 100vh;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 4rem 1.5rem;

    background-color: var(--card-bg);
}


/* =========================
   CONTAINER
========================= */

.container {
    width: min(100%, 1000px);
    margin: 0 auto;
}


/* =========================
   WRAPPER
========================= */

.wrapper {
    width: 100%;
}


/* =========================
   INITIALIZE
========================= */

#initialize .container {
    width: min(100%, 650px);
}

#initialize .wrapper {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;

    padding: 3rem;

    background-color: var(--white);

    border: 1px solid var(--border-color);
    border-radius: 16px;

    box-shadow:
        0 6px 16px rgba(7, 56, 39, 0.06);
}


/* =========================
   FORM HEADER
========================= */

#initialize .wrapper::before {
    content: "MATHEMATICS";

    display: block;

    font-family: var(--font-brand);
    font-size: 0.75rem;
    font-weight: 800;

    letter-spacing: 0.15em;

    color: var(--primary-forest);
}


/* =========================
   FORM
========================= */

.field-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.field-group label {
    font-size: 0.85rem;
    font-weight: 700;

    color: var(--text-main);
}

.field-group input,
.field-group select {
    width: 100%;

    padding: 0.9rem 1rem;

    border: 1px solid var(--border-color);
    border-radius: 8px;

    background-color: var(--white);
    color: var(--text-body);

    font-family: var(--font-body);
    font-size: 0.95rem;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease,
        background-color 0.2s ease;
}

.field-group input:focus,
.field-group select:focus {
    border-color: var(--primary-accent);

    background-color: var(--white);

    box-shadow:
        0 0 0 3px var(--tint-light);
}


/* =========================
   QUIZ
========================= */

#quiz {
    width: 100%;

    padding: 2.5rem 1.5rem;

    display: block;

    background-color: #f4fbf7;

    /*
       Subtle mathematical grid
    */

    background-image:
        linear-gradient(
            rgba(22, 98, 61, 0.045) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(22, 98, 61, 0.045) 1px,
            transparent 1px
        );

    background-size: 25px 25px;
}

#quiz .container {
    width: min(100%, 1100px);
    margin: 0 auto;
}


/* =========================
   QUESTION WRAPPER
========================= */

#question-wrapper {
    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 1.5rem;

    width: 100%;

    padding: 1.5rem;

    background-color: var(--white);

    border: 1px solid var(--border-color);
    border-radius: 16px;

    box-shadow:
        0 6px 16px rgba(7, 56, 39, 0.06);
}


/* =========================
   QUESTION
========================= */

#question-wrapper > .wrapper:first-child {
    display: flex;
    flex-direction: column;

    gap: 1.5rem;

    min-width: 0;
}

#question {
    display: block;

    max-width: 100%;

    font-family: var(--font-body);
    font-size: clamp(1.1rem, 3vw, 1.5rem);
    font-weight: 700;

    line-height: 1.6;

    color: var(--text-main);

    overflow-wrap: break-word;
}


/* =========================
   QUESTION LABEL
========================= */

#question::before {
    content: "Problem";

    display: block;

    margin-bottom: 0.5rem;

    font-size: 0.7rem;
    font-weight: 800;

    letter-spacing: 0.1em;
    text-transform: uppercase;

    color: var(--primary-forest);
}


/* =========================
   DATASET
========================= */

#dataset {
    display: block;

    padding: 1.25rem;

    background-color: var(--card-bg);

    color: var(--text-body);

    border: 1px solid var(--border-color);
    border-left: 4px solid var(--primary-forest);

    border-radius: 8px;

    font-family: "Courier New", monospace;
    font-size: 0.95rem;

    line-height: 1.6;

    overflow-x: auto;
    overflow-wrap: break-word;
}


/* =========================
   STUDENT ANSWER
========================= */

#studentAnswer {
    display: flex;
    flex-direction: column;

    gap: 1rem;

    padding: 1.5rem;

    background-color: var(--card-bg);

    border: 1px solid var(--border-color);
    border-radius: 12px;
}


/* =========================
   ANSWER INPUT
========================= */

#studentAnswer input {
    width: 100%;

    padding: 0.9rem 1rem;

    border: 1px solid var(--border-color);
    border-radius: 8px;

    background-color: var(--white);

    color: var(--text-body);

    font-family: var(--font-body);
    font-size: 1rem;

    outline: none;

    transition:
        border-color 0.2s ease,
        box-shadow 0.2s ease;
}

#studentAnswer input:focus {
    border-color: var(--primary-accent);

    box-shadow:
        0 0 0 3px var(--tint-light);
}


/* =========================
   MATHEMATICAL INPUT
========================= */

#studentAnswer input[type="number"] {
    font-family: "Courier New", monospace;
}


/* =========================
   ANSWER / RESULT
========================= */

#answer {
    display: flex;
    flex-direction: column;

    gap: 1rem;

    padding-top: 1rem;

    color: var(--text-body);

    line-height: 1.6;

    overflow-wrap: break-word;
}


/* =========================
   BUTTON
========================= */

button {
    padding: 0.8rem 1.5rem;

    border: none;
    border-radius: 7px;

    background-color: var(--primary-forest);

    color: var(--white);

    font-family: var(--font-body);
    font-size: 0.9rem;
    font-weight: 700;

    cursor: pointer;

    transition:
        background-color 0.2s ease,
        transform 0.1s ease,
        box-shadow 0.2s ease;
}

button:hover {
    background-color: var(--primary-dark);

    box-shadow:
        0 4px 14px rgba(22, 98, 61, 0.2);
}

button:active {
    transform: translateY(1px);
}


/* =========================
   QUIZ END
========================= */

.quiz-end {
    display: flex;
    flex-direction: column;

    gap: 2rem;

    padding: 4rem 3rem;

    text-align: center;

    background-color: var(--white);

    border: 1px solid var(--border-color);
    border-radius: 16px;

    box-shadow:
        0 6px 16px rgba(7, 56, 39, 0.06);
}

.quiz-end-header {
    display: flex;
    flex-direction: column;

    gap: 0.5rem;
}

.quiz-end-title {
    font-family: var(--font-brand);

    font-size: clamp(2rem, 5vw, 3rem);
    font-weight: 900;

    color: var(--primary-dark);
}

.quiz-end-message {
    color: var(--text-muted);

    line-height: 1.5;
}


/* =========================
   RESULT
========================= */

.quiz-result {
    display: flex;

    justify-content: center;

    gap: 1rem;

    flex-wrap: wrap;
}

.result-item {
    min-width: 180px;

    display: flex;
    flex-direction: column;

    gap: 0.5rem;

    padding: 1.5rem;

    background-color: var(--card-bg);

    border: 1px solid var(--border-color);
    border-radius: 12px;

    box-shadow:
        0 4px 10px rgba(7, 56, 39, 0.04);
}

.result-label {
    font-size: 0.75rem;
    font-weight: 800;

    color: var(--text-muted);

    text-transform: uppercase;
    letter-spacing: 0.08em;
}

.result-value {
    font-family: var(--font-brand);

    font-size: 1.8rem;
    font-weight: 900;

    color: var(--primary-forest);
}


/* =========================
   QUIZ END ACTIONS
========================= */

.quiz-end-actions {
    display: flex;

    justify-content: center;
}


/* =========================
   RESPONSIVE
========================= */

@media (max-width: 700px) {

    .section {
        padding: 2rem 1rem;
    }

    #initialize .wrapper {
        padding: 2rem 1.25rem;

        border-radius: 12px;
    }

    #question-wrapper {
        grid-template-columns: 1fr;

        padding: 1.25rem;

        border-radius: 12px;
    }

    #question {
        font-size: 1.25rem;
    }

    #quiz {
        padding: 1rem;
    }

    .quiz-end {
        padding: 3rem 1.5rem;

        border-radius: 12px;
    }

    .quiz-result {
        flex-direction: column;
    }

    .result-item {
        width: 100%;
    }
}


/* =========================
   HIDDEN
========================= */

[hidden] {
    display: none !important;
}

class DataSet{

    constructor(set = []){
        this.dataset = set
    }
    addDAta(data){
        this.dataset.push(data)
        return this;
    }
    getData(){
        return this.dataset
    }

    /**
     * compute the mean of the dataset
     * sum of data set / number of items in dataset
     * @returns the mean of the dataset
     */
    mean(){
        return this.dataset.reduce((total, value) => total + value, 0) / this.dataset.length;
    }
    /**
     * 
     * @returns returns median
     */
    median(){
        const sorted = [...this.dataset].sort((a, b) => a - b);
        const n = sorted.length;

        if (n % 2 !== 0) {
            return sorted[(n - 1) / 2];
        }

        return (sorted[n / 2 - 1] + sorted[n / 2]) / 2;
    }
    /**
     * find the mode
     * @returns return the most frequent number
     */

mode() {
    const counts = {};
    let maxFreq = 0;
    let modes = [];

    for (let d of this.dataset) {
        counts[d] = (counts[d] || 0) + 1;

        if (counts[d] > maxFreq) {
            maxFreq = counts[d];
            modes = [d];
        } 
        else if (counts[d] === maxFreq) {
            if (!modes.includes(d)) {
                modes.push(d);
            }
        }
    }

    // If every value occurs only once,
    // there is no mode.
    if (maxFreq === 1) {
        return [];
    }

    return modes;
}
    sum(){
        return this.dataset.reduce((total, value) => total + value, 0)
    }
    
}
class StandardDeviation{
    constructor(dataset){
        this.dataset = dataset;  
    }
    sumOfSquare(){
        const mean = this.dataset.mean()
        return this.dataset.getData().reduce((total, value) => total + (value - mean)**2, 0)
    }
    populationVariance(){
        return this.sumOfSquare()/this.dataset.getData().length
    }
    range(){
        return Math.max(...this.dataset.getData()) - Math.min(...this.dataset.getData())
    }
    population(){ 
          return Math.sqrt(this.populationVariance())
    }
    sampleVariance(){
        return this.sumOfSquare()/(this.dataset.getData().length-1)
    }
    sample(){
        return Math.sqrt(this.sampleVariance())
    }
}

function generateSampleSize(populationSize) {
    const min = 5;
    const max = Math.min(15, populationSize - 1);
    return constraint(min, max)
}

function constraint(c1, c2) {
    // check if c1 and c2 have valid value
    if ((c1.length === 0 || c1 === null) || (c2.length === 0 || c2 === null)) {
        return 0;
    }
    if (c1 > c2) {
        return 0;
    }

    return Math.floor(Math.random() * (Math.floor(c2) - Math.ceil(c1) + 1)) + Math.ceil(c1)
}
