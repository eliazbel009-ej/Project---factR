<!DOCTYPE html>
<html>
<head>
<title>Project FACTR</title>
<style>
a{
  color: white;
  text-decoration: none;
  background-color: darkgreen;
  padding: 3px 5px;
}
a:visited {
  text-decoration: none;
}
a:hover {
  color: navy;
  background-color: powderblue;
  text-decoration: none;
}
</style>
</head>
<body>

<div style="font-size:1.2em;">
<p>Perform the mathematical operation below:</p> <b><span id="displayGiven" style="font-size:1.3em;"></span></b><br><br>
<label for="fname">Type your answer: </label><br>
<input type="text" id="ans" name="ans">
<button onclick="checkAns()"> Submit Answer </button><br><br>
<i><span id="outAns"></span></i>
</div><br>
<a href="basicOperation.html"> Next Item </a>

<script>
let ansr = 0;
let n1 = Math.round(Math.random() * 1000)%12 + 2; // 1st random number from 2 to 13
let n2 = Math.round(Math.random() * 1000)%12 + 1;  // 2nd random number from 1 to 11
let oper = Math.round(Math.random() * 1000) % 5;  // random number for math operation
let n3 = n1 * n2;	// random number for division without remainder

switch(oper){
/*Addition*/
case 0: document.getElementById("displayGiven").innerHTML = n1+5 + " + " + n2 + " = ?"; ansr = n1 + 5 + n2; break;

/*Subtraction*/
case 1: document.getElementById("displayGiven").innerHTML = n1 + " - " + n2 + " = ?"; ansr = n1 - n2; break;

/*Multiplication*/
case 2: document.getElementById("displayGiven").innerHTML = n1 + " × " + n2 + " = ?"; ansr = n1 * n2; break;

/*Division w/o remainder*/
case 3: document.getElementById("displayGiven").innerHTML = n3 + " ÷ " + n1 + " = ?"; ansr = n2; break;

/*Square of a number*/
case 4: document.getElementById("displayGiven").innerHTML = n1+1 + "<sup>2</sup> = ?"; ansr = (n1+1) * (n1+1); break;
}

function checkAns(){
document.getElementById("outAns").innerHTML = "The answer is " + ansr;
}
</script>

</body>
</html>
